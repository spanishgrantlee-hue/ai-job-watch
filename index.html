<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Every route sets its own title, description, canonical, og:url and
      og:/twitter: title/description via react-helmet-async (see
      src/pages/*.jsx). With React 19, Helmet adds its OWN tags rather than
      reusing static ones, so a plain static tag here would leave two
      conflicting tags in the DOM.

      The data-static-seo tags below are brand-only fallbacks for crawlers
      and link previews that don't run JavaScript. src/main.jsx removes them
      before React renders, so once the app runs Helmet's per-page tags are
      the only ones. Never add canonical or og:url here -- those must be
      page-specific, and a shared fallback would point every page at one URL.
    -->
    <title data-static-seo>AI Job Watch</title>
    <meta data-static-seo name="description" content="AI Job Watch gives you a free, personalized AI Resistance Score — see how exposed or protected your job is from automation." />
    <meta data-static-seo property="og:title" content="AI Job Watch" />
    <meta data-static-seo property="og:description" content="AI Job Watch gives you a free, personalized AI Resistance Score — see how exposed or protected your job is from automation." />
    <meta data-static-seo name="twitter:title" content="AI Job Watch" />
    <meta data-static-seo name="twitter:description" content="AI Job Watch gives you a free, personalized AI Resistance Score — see how exposed or protected your job is from automation." />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="AI Job Watch" />
    <meta property="og:image"       content="https://aijobwatch.org/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:image"       content="https://aijobwatch.org/og-default.png" />

    <!-- Google Analytics -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1PLF7LBKP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W1PLF7LBKP');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>AI Job Watch is a free AI job risk assessment. Answer questions about your work to get a personalized AI Resistance Score showing how exposed or protected your job is from automation. Please enable JavaScript to take the assessment.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
