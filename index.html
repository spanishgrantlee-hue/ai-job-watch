<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, meta description, og:url/og:title/og:description, and
      twitter:title/twitter:description are deliberately NOT set here:
      react-helmet-async doesn't replace tags it didn't itself render, so a
      static tag here plus a per-page <Helmet> override produces two
      conflicting tags in the DOM instead of one correct one. Every route
      sets its own title/description via Helmet (see src/pages/*.jsx), so
      this file only carries tags no page overrides, to stay the single
      source of truth for each.
    -->

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="https://aijobwatch.org/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:image"       content="https://aijobwatch.org/og-default.png" />

    <!-- Google Analytics -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1PLF7LBKP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W1PLF7LBKP');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
